# LiteLLM Proxy Config — 상상우리 AI 거버넌스 PoC
# LiteLLM version: 1.83.7
# 주의: v1.82.7 / v1.82.8 은 공급망 공격 이슈로 사용 금지

model_list:
  # 무료 테스트 모델 — OpenRouter free tier (API key 필요, 무료)
  - model_name: ssw-free-test
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  # 저가 모델 — 일반 직원 허용
  - model_name: ssw-low-cost
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  # 개발자 Claude 모델
  - model_name: ssw-dev-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  # 개발자 GPT 모델
  - model_name: ssw-dev-gpt
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 고가 모델 (차단 테스트용 — 실제 호출 안 됨)
  - model_name: ssw-expensive
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Mock provider — API key 없이 정책/예산 테스트용 (LiteLLM 내장 mock_response)
  - model_name: ssw-fake
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: fake-key-not-used
      mock_response: "안녕하세요! 상상우리 AI 게이트웨이 Mock 응답입니다. 거버넌스 PoC 테스트 성공."

  # Claude Code CLI 경유 테스트용 — claude-haiku-4-5 mock (Phase 2)
  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: fake-key-not-used
      mock_response: "Claude Code → LiteLLM 게이트웨이 경유 성공! 가상키(dev-kim-claude) 모델 제어 검증 완료. [mock]"

  # Codex CLI 경유 테스트용 — gpt-4o-mini mock (Phase 2)
  - model_name: codex-mock
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: fake-key-not-used
      mock_response: "Codex CLI → LiteLLM 게이트웨이 경유 성공! 가상키(dev-kim-codex) 모델 제어 검증 완료. [mock]"

  # Codex CLI는 표준 OpenAI 모델명 필요 → gpt-4o-mini alias로 mock 처리
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: fake-key-not-used
      mock_response: "Codex CLI(gpt-4o-mini) → LiteLLM 게이트웨이 경유 성공! 가상키(dev-kim-codex) 정책 제어 검증 완료. [mock]"

  # ── Phase 2.3 — 실제 Provider alias (OpenRouter / Groq) ───────────────────

  # OpenRouter 무료 모델 — Google Gemma 4 31B free (2025-07 안정적)
  - model_name: ssw-free-openrouter
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  # OpenRouter 저가 모델 — NVIDIA Nemotron 3 Nano 30B free
  - model_name: ssw-low-cost-real
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Groq 빠른 모델 — llama-3.1-8b-instant (초저지연 검증용)
  - model_name: ssw-fast-groq
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # 비허용 모델 차단 테스트용 고가 alias (Phase 2.3 Scenario 3)
  - model_name: ssw-expensive-real
    litellm_params:
      model: openrouter/anthropic/claude-opus-4
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # 요청/응답 본문 로그 비활성 (개인정보 보호)
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

router_settings:
  model_group_alias:
    claude-sonnet: ssw-dev-sonnet
    gpt-dev: ssw-dev-gpt
    low-cost: ssw-low-cost
    free-test: ssw-free-test
    fake: ssw-fake
  # Phase 2.3: free tier rate limit(429) 시 자동 fallback
  fallbacks:
    - ssw-free-openrouter:
        - ssw-low-cost-real
